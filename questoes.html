<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questões do bloco · Plano TJ-SP</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5f8b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f4f2; --card:#ffffff; --ink:#1b2129; --muted:#5d6672; --line:#dde1de;
  --accent:#1f5f8b; --ok:#2f7a4f; --dir:#2f7a4f; --warn:#b3541e;
  --display:"IBM Plex Serif", Georgia, serif; --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#14181d; --card:#1c2128; --ink:#e7eaee; --muted:#9aa4af; --line:#2c333c;
    --accent:#6aa9d8; --ok:#5fb585; --dir:#5fb585; --warn:#e38a55; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:16px}
a{color:var(--accent)}
.back{font-size:14px;text-decoration:none;font-weight:600}
h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--dir);border-radius:10px;padding:16px;display:grid;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.prog{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:10px 14px;font:600 15px var(--body);cursor:pointer;text-decoration:none}
.btn.sec{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
ul.q{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.q li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
ul.q li.on{opacity:.6}
ul.q li.on b{text-decoration:line-through}
ul.q input{width:20px;height:20px;accent-color:var(--ok);margin:0}
ul.q small{display:block;color:var(--muted);font-size:13px}
ul.q a{font-weight:600;text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
.grp{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.note{font-size:14px;color:var(--muted);margin:0}
.idx{display:grid;gap:8px}
.idx a{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--ink)}
.idx a span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="questoes-data.js"></script>
<script>
const KEY="tjsp-plano-100d";
const QS=window.QS||{}, INFO=window.QINFO||{}, QURL=window.QURL||"";
let st;
function load(){ st={s:{},a:{},d:{},r:{},e:{},q:{}}; try{const raw=localStorage.getItem(KEY); if(raw) st=Object.assign(st,JSON.parse(raw)); if(!st.q) st.q={};}catch(e){} }
function save(){ st.t=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){} }
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}
function localISO(){const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function label(q){return q.a==="-"?"não é do Estatuto":"art. "+q.a;}
function blockName(){ return new URLSearchParams(location.search).get("b"); }
// Bloco só de questões: marcar todas deixa o bloco como Feito no plano.
function syncStatus(title){
  const inf=INFO[title]; if(!inf||!inf.q) return;
  const main=QS[title].filter(q=>!q.x); const n=main.filter(q=>st.q[q.c]).length; const id=inf.id; const cur=st.s[id]||"A fazer";
  if(n===main.length){ st.s[id]="Feito"; if(!st.d[id]){st.d[id]=localISO(); st.r[id]=0;} }
  else if(n>0||cur==="Feito"){ st.s[id]="Em andamento"; delete st.d[id]; delete st.r[id]; }
}
function renderIndex(){
  document.title="Questões por bloco · Plano TJ-SP";
  const blocks=Object.keys(QS).sort((a,b)=>(INFO[a].dn-INFO[b].dn)||(INFO[a].blk-INFO[b].blk));
  let h="<a class='back' href='index.html'>← Voltar ao plano</a><header><h1>Questões por bloco</h1><p class='sub'>Questões Vunesp do Gran separadas por artigo, na ordem do plano.</p></header><nav class='idx'>";
  blocks.forEach(b=>{const m=QS[b].filter(q=>!q.x); const d=m.filter(q=>st.q[q.c]).length; const i=INFO[b];
    h+="<a href='questoes.html?b="+encodeURIComponent(b)+"'><b>"+esc(b)+"<br><small style='color:var(--muted);font-weight:400'>"+esc(i.dl)+" · bloco "+i.blk+" · dia "+i.dn+"</small></b><span>"+d+" de "+m.length+"</span></a>";});
  document.getElementById("app").innerHTML=h+"</nav>";
}
function renderBlock(title){
  const qs=QS[title]; const inf=INFO[title];
  if(!qs){ document.getElementById("app").innerHTML="<a class='back' href='index.html'>← Voltar ao plano</a><p>Este bloco ainda não tem questões separadas. <a href='questoes.html'>Ver os blocos que têm</a>.</p>"; return; }
  document.title=title+" · Questões";
  const main=qs.filter(q=>!q.x), extra=qs.filter(q=>q.x); const done=main.filter(q=>st.q[q.c]).length;
  const next=main.find(q=>!st.q[q.c]);
  const li=q=>{const on=!!st.q[q.c]; return "<li class='"+(on?"on":"")+"'><input type='checkbox' id='c"+q.c+"' data-q='"+q.c+"'"+(on?" checked":"")+" aria-label='Marcar Q"+q.c+" como feita'><label for='c"+q.c+"'><b>Q"+q.c+" · "+esc(label(q))+"</b><small>"+q.y+" · "+esc(q.p)+"</small></label><a href='"+QURL+q.c+"' target='_blank' rel='noopener' data-open='"+q.c+"'>Abrir</a></li>";};
  let h="<a class='back' href='index.html'>← Voltar ao plano</a>";
  h+="<header><h1>"+esc(title)+"</h1><p class='sub'>"+esc(inf.d)+" · "+esc(inf.dl)+" · bloco "+inf.blk+" · dia "+inf.dn+" do plano</p></header>";
  h+="<section class='card'><div class='prog'><div class='bar'><i style='width:"+Math.round(done/main.length*100)+"%'></i></div><span>"+done+" de "+main.length+" feitas</span></div>";
  h+="<div class='btns'>"+(next?"<a class='btn' href='"+QURL+next.c+"' target='_blank' rel='noopener' data-open='"+next.c+"'>Abrir a próxima: Q"+next.c+"</a>":"<button class='btn' disabled>Todas feitas</button>")+"<a class='btn sec' href='questoes.html'>Outros blocos</a></div>";
  h+="<p class='note'>A questão abre no Gran em outra aba. Resolva lá e volte aqui para marcar. Na ordem dos artigos fica mais fácil reler a lei a cada erro.</p></section>";
  h+="<ul class='q'>"+main.map(li).join("")+"</ul>";
  if(extra.length) h+="<p class='grp'>Opcional · fora do recorte do edital</p><p class='note'>Férias, licenças, vencimentos, aposentadoria e outros temas que o plano não estuda. Só se sobrar tempo.</p><ul class='q'>"+extra.map(li).join("")+"</ul>";
  const app=document.getElementById("app"); app.innerHTML=h;
  app.querySelectorAll("input[data-q]").forEach(cb=>cb.addEventListener("change",()=>{ load(); if(cb.checked) st.q[cb.dataset.q]=true; else delete st.q[cb.dataset.q]; syncStatus(title); save(); render(); }));
}
function render(){ const b=blockName(); if(b) renderBlock(b); else renderIndex(); }
window.addEventListener("storage",ev=>{ if(ev.key===KEY){ load(); render(); }});
load(); render();
if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
